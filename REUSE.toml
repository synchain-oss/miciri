# SPDX-License-Identifier: GPL-3.0-or-later
# Derived from synchain-oss/rinne; see upstream/ci.json
#
# 许可与版权的机读登记（REUSE 3.3）。小节一次建好，以后只往自己负责的那一节里加块；
# 小节标记由 run-checks 的 reuse 检查核对，不要删改或调换顺序。
# 同一文件匹配多个块时，后面的块优先，所以兜底块必须放在最前。
version = 1

# --- section:base ---
# 兜底：本仓自己写的一切。能写注释的源文件仍须逐个加 SPDX 头，由 check-spdx 把关。
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- section:untagged ---
# 不能带注释头的自有文件：单行钉版文件、JSON、golden 数据与合成音频夹具。许可与兜底相同，单列出来一眼可查。
[[annotations]]
path = [
  ".*-version",
  ".juce-commit",
  ".prettierrc.json",
  ".github/*.json",
  ".github/rulesets/*.json",
  "scripts/ci/mac/*.sha256",
  "packaging/win/*.sha256",
  "upstream/*.json",
  "tests/golden/**",
  "tests/fixtures/**",
]
SPDX-FileCopyrightText = "2026 Synchain"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- section:juce-web-js ---
# JUCE 自带的前端辅助脚本（web/js/juce/）随 JUCE 的许可（AGPL-3.0-only），不加 Synchain 版权。
# 文件入库时在此加块，并把 LICENSES/AGPL-3.0-only.txt 一起带进来。

# --- section:third-party ---
# 第三方的字体、代码与数据：每一项写明来源、版权与许可，precedence = "override"。入库时在此加块。

[[annotations]]
path = "third_party/pocketfft/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "2010-2024 Max-Planck-Society",
  "2019-2020 Peter Bell",
  "2003, 2007-2014 Matteo Frigo and Massachusetts Institute of Technology",
  "2024 Tan Ping Liang, Peter Bell",
  "2024 Cris Luengo",
]
SPDX-License-Identifier = "BSD-3-Clause"

# Inno Setup 官方仓库 Unofficial 目录里的简体中文向导翻译，原样提交（哈希钉在 packaging/win/ChineseSimplified.isl.sha256）。
# 文件头没有写许可，沿用它所在仓库的 Inno Setup License；来源与上游的 MIT 翻译仓见同目录的 SOURCE.txt。
[[annotations]]
path = "packaging/win/languages/ChineseSimplified.isl"
precedence = "override"
SPDX-FileCopyrightText = [
  "1997-2026 Jordan Russell",
  "2000-2026 Martijn Laan",
  "Zhenghan Yang (translation)",
]
SPDX-License-Identifier = "LicenseRef-Inno-Setup"
