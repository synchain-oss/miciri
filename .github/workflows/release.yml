# Derived from synchain-oss/rinne; see upstream/release.json
#
# 发版：推一个 vX.Y.Z tag ⇒ verify-tag → build → draft-release。tag 只打在 prod 上，只由维护者在 preview 批准之后打。
#   1. verify-tag      scripts/check-release-tag.ps1：tag 形如 vX.Y.Z（可带预发布后缀）、核心版本等于 CMakeLists.txt 的工程版本、
#                      被 tag 的提交在 origin/prod 的历史上。
#   2. build           以 workflow_call 调用 build.yml（Win、mac、sanitizers、web-smoke）。tag 靠 github 上下文隐式传递：
#                      release.yml 由 push tag 触发，被调用方拿到的 github.ref 就是 refs/tags/<tag>，ref_type 是 tag。with: 留空，
#                      因为 tag 是不可信文本，而工作流检查禁止在 with: 里插值表达式。安装包就在 build.yml 的 build-win、build-mac
#                      里打好、静默安装（或展开）核过内容再上传；ref_type 是 tag 时按发布的严格度打包（许可全文、第三方声明缺一就红），
#                      探针开关：scripts/package.ps1（本地 gates 与这两个构建 job 共用的同一份）打包前显式再配置
#                      -DMICIRI_HOST_PROBE=OFF 并增量构建，再读 CMake 缓存断言它不是 ON，是 ON 就让打包失败、报明原因；
#                      选项还没合入时缓存里没有这一项，算通过。发布包因此不会带探针。
#   3. draft-release   取回两个安装包，scripts/package.ps1 -Collect 核产物清单（恰好这两个、文件名由工程版本算出、不是空壳）、
#                      写 SHA256SUMS 与发布说明（含 GPLv3 第 6 条 (d) 的对应源码指引），再 gh release create --draft。
#                      只建草稿，由维护者确认后才发布。contents: write 只在这一个 job 上。
# 不用第三方 release action：runner 自带 gh CLI，少一个持写权限的第三方依赖。
# 不设 workflow_dispatch：手动跑既没有 tag 可比对，也没有 tag 可挂 Release。
# 本文件进默认分支之前不能 dispatch；安装包的打包与验证先在 build.yml 的两个构建 job 上跑通，这里只多出取回与建草稿。
name: Release

on:
  push:
    # 只认 vX.Y.Z 与带预发布后缀的 vX.Y.Z-…；其余 v* 不触发。verify-tag 仍会再核一次形状。
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  # tag 推送不取消：每次推送对应确定的提交，取消会让同一次发版的两轮跑互相踩。
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tag 门禁要跟 origin/prod 比祖先关系，要完整的历史。
          fetch-depth: 0
          persist-credentials: false

      - name: Tag shape, version and branch
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin prod
          pwsh -NoProfile -File scripts/check-release-tag.ps1 -Tag "$TAG_NAME"

  build:
    name: build
    needs: verify-tag
    permissions:
      contents: read
    # with: 留空：tag 通过 github 上下文隐式传递（见文件头）。
    uses: ./.github/workflows/build.yml

  draft-release:
    name: draft-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Miciri-installer-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      - name: Check the asset list, write checksums and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: pwsh -NoProfile -File scripts/package.ps1 -Collect "$RUNNER_TEMP/assets" -Tag "$TAG_NAME" -Notes "$RUNNER_TEMP/release-notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag --title "Miciri $TAG_NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
          case "$TAG_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG_NAME" "${flags[@]}" "$RUNNER_TEMP"/assets/*
