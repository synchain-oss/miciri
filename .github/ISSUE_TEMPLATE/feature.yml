# Derived from synchain-oss/rinne; see upstream/ci.json
# 标签必须是 .github/labels.json 里登记过的。
name: 功能建议 · Feature request
description: 新功能或改进 · Suggest an idea
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 · Problem
      description: 你在录什么、现在卡在哪里 · What you are recording and what gets in the way
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 · Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法 · Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: 底线 · Ground rules
      options:
        - label: 这个建议不要求插件改动声音：音频仍然逐位直通 · It does not make the plugin alter the sound: audio stays bit-exact passthrough
        - label: 这个建议不要求把音频写盘或上传 · It does not require writing audio to disk or uploading it
